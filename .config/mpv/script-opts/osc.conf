# Built-in on-screen controller (mpv 0.41 keys): slim bottom bar on crust,
# green for the playhead time and held controls. Colours are unquoted here
# (script-opts files don't treat # as a comment mid-line).
layout=bottombar
seekbarstyle=bar
hidetimeout=800
fadeduration=150
background_color=#11111b
timecode_color=#cdd6f4
title_color=#cdd6f4
buttons_color=#cdd6f4
top_buttons_color=#cdd6f4
time_pos_color=#a6e3a1
held_element_color=#a6e3a1
