{
  // Start with discovery off; press s to scan when pairing something new.
  adapter-states: "scan:no"
  // Help line hidden so the window can stay narrow; press ? for the full list.
  no-help-display: true
  // Catppuccin Mocha on the Quickshell green ramp: green = on, dim green =
  // other adapter states, grey = inactive; only errors break out (red).
  // Colors accept hex (#RRGGBB), tcell color names, or "transparent".
  theme: {
    Text: "#CDD6F4"
    Border: "#A6E3A1"
    Background: "transparent"
    StatusInfo: "#CDD6F4"
    StatusError: "#F38BA8"

    Adapter: "#CDD6F4"
    AdapterPowered: "#A6E3A1"
    AdapterNotPowered: "#F38BA8"
    AdapterDiscoverable: "#62865F"
    AdapterScanning: "#62865F"
    AdapterPairable: "#62865F"

    Device: "#CDD6F4"
    DeviceType: "#9399B2"
    DeviceAlias: "#CDD6F4"
    DeviceConnected: "#A6E3A1"
    DeviceDiscovered: "#CDD6F4"
    DeviceProperty: "#9399B2"
    DevicePropertyConnected: "#A6E3A1"
    DevicePropertyDiscovered: "#9399B2"

    Menu: "#CDD6F4"
    MenuBar: "transparent"
    MenuItem: "#CDD6F4"

    ProgressBar: "#A6E3A1"
    ProgressText: "#CDD6F4"
  }

  // Vim-style navigation (arrow keys still work elsewhere; these add h/j/k/l/g/G).
  // q quits; Escape closes menus and popups (the usual TUI split).
  keybindings: {
    NavigateUp: "k"
    NavigateDown: "j"
    NavigateLeft: "h"
    NavigateRight: "l"
    NavigateTop: "g"
    NavigateBottom: "G"
    Quit: "q"
    Close: "Esc"
  }
}
