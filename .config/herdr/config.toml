onboarding = false
# herdr configuration -- https://herdr.dev/docs/configuration/
# Defaults are good; only deliberate choices live here.
# Keybinds: hybrid -- the three tmux reflexes are ported (ctrl+space prefix,
# direct ctrl+h/j/k/l pane nav, alt+shift+h/l tab switching); everything else
# uses herdr defaults so prefix+? help stays accurate.

[keys]
prefix = "ctrl+space"
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"
previous_tab = "alt+shift+h"
next_tab     = "alt+shift+l"
# Workspace cycling completes the alt+shift hand-shape: h/l tabs, k/j workspaces
previous_workspace = "alt+shift+k"
next_workspace     = "alt+shift+j"
# One chord from anywhere to any agent row in the sidebar
focus_agent = "alt+1..9"

[theme]
name = "catppuccin"

[theme.custom]
# Make the tab bar / panels share the terminal background instead of the
# theme's slightly different panel shade.
panel_bg = "reset"
# State colors pinned to Catppuccin Mocha (sidebar rail dots and state text)
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"

[session]
# Relaunch agents (claude --resume <id>) with workspace/tab/pane layout
# after a server restart or reboot -- the reason for moving agent work here.
resume_agents_on_restore = true

[experimental]
# Kitty graphics inside panes (fastfetch palkia logo). Off by default;
# needs a kitty-graphics-capable outer terminal (kitty qualifies).
kitty_graphics = true

[update]
channel = "preview"

[ui]
# tmux-style pane separation: single shared divider lines instead of each
# pane floating in its own bordered box with gaps.
# Borderless panes separated by whitespace. (Tried and rejected: full boxes,
# shared borders -- perimeter unavoidable; no divider-only mode upstream.)
pane_gaps = true
pane_borders = false

# Minimal sidebar: one compact row per space (no number token exists upstream;
# workspace name is the smallest available identifier). Lavender accent for
# the selected entry to match the rig.
accent = "#b4befe"

# Sidebar toggle is binary: fully open or fully hidden (no dot rail).
sidebar_collapsed_mode = "hidden"

[ui.sidebar.spaces]
row_gap = 0
rows = [["workspace"]]

[ui.sidebar.agents]
row_gap = 0
rows = [["tab"]]

