# macOS-only settings (included from kitty.conf via ${KITTY_OS}.conf).

# No title bar; titlebar-only keeps the rounded corners the borders follow.
hide_window_decorations titlebar-only

# skhd takes option (alt) as the window-manager modifier, where SUPER sits on
# a PC keyboard. cmd sits where alt does, so it stands in for alt here and
# herdr's alt binds (config.toml) keep the same finger positions as on Linux.
map cmd+shift+h send_key alt+shift+h
map cmd+shift+j send_key alt+shift+j
map cmd+shift+k send_key alt+shift+k
map cmd+shift+l send_key alt+shift+l
map cmd+1 send_key alt+1
map cmd+2 send_key alt+2
map cmd+3 send_key alt+3
map cmd+4 send_key alt+4
map cmd+5 send_key alt+5
map cmd+6 send_key alt+6
map cmd+7 send_key alt+7
map cmd+8 send_key alt+8
map cmd+9 send_key alt+9
