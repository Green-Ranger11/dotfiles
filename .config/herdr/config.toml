onboarding = false
# herdr configuration -- https://herdr.dev/docs/configuration/
# Defaults are good; only deliberate choices live here.
# Keybinds: hybrid -- the three tmux reflexes are ported (ctrl+space prefix,
# direct ctrl+h/j/k/l pane nav, alt+shift+h/l tab switching); everything else
# uses herdr defaults so prefix+? help stays accurate.

[keys]
prefix = "ctrl+space"
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"
previous_tab = "alt+shift+h"
next_tab     = "alt+shift+l"
# Workspace cycling completes the alt+shift hand-shape: h/l tabs, k/j workspaces
previous_workspace = "alt+shift+k"
next_workspace     = "alt+shift+j"
# One chord from anywhere to any agent row in the sidebar
focus_agent = "alt+1..9"

[theme]
name = "catppuccin"

[session]
# Relaunch agents (claude --resume <id>) with workspace/tab/pane layout
# after a server restart or reboot -- the reason for moving agent work here.
resume_agents_on_restore = true

[experimental]
# Kitty graphics inside panes (fastfetch palkia logo). Off by default;
# needs a kitty-graphics-capable outer terminal (kitty qualifies).
kitty_graphics = true

[update]
channel = "preview"
