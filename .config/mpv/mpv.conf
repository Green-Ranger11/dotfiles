# mpv: default video/audio player (mimeapps.list). Minimal, Catppuccin Mocha
# on crust with the green accent, like kitty/imv/zathura.
keep-open=yes
save-position-on-quit=yes
background-color='#11111b'
osd-font='CommitMono Nerd Font'
osd-font-size=28
osd-color='#cdd6f4'
osd-border-color='#11111b'
osd-border-size=2
osd-bar-align-y=0.9
sub-font='CommitMono Nerd Font'
screenshot-directory=~/Pictures/Screenshots
